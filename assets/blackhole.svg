<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Animated black hole with a swirling accretion disk">
  <title>Black hole</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7F00FF" stop-opacity=".45"/>
      <stop offset="40%"  stop-color="#7F00FF" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D4FF"/>
      <stop offset="22%"  stop-color="#A855F7"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="78%"  stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <linearGradient id="jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#C9A3FF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- deep space -->
  <rect width="800" height="300" fill="#0D1117"/>

  <!-- starfield -->
  <g fill="#E6EDF3">
    <circle cx="42"  cy="38"  r="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="92"  r="0.9"><animate attributeName="opacity" values=".7;.15;.7" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="76"  cy="196" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="162" cy="252" r="1.0"><animate attributeName="opacity" values=".8;.2;.8" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="214" cy="46"  r="1.1"><animate attributeName="opacity" values=".25;.85;.25" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="268" cy="214" r="0.8"><animate attributeName="opacity" values=".6;.1;.6" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="28"  r="1.3"><animate attributeName="opacity" values=".35;.95;.35" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="396" cy="268" r="1.0"><animate attributeName="opacity" values=".75;.2;.75" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="458" cy="34"  r="0.9"><animate attributeName="opacity" values=".2;.8;.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="524" cy="246" r="1.2"><animate attributeName="opacity" values=".9;.25;.9" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="588" cy="62"  r="1.1"><animate attributeName="opacity" values=".3;.9;.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="642" cy="188" r="0.8"><animate attributeName="opacity" values=".65;.15;.65" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="698" cy="104" r="1.4"><animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="734" cy="232" r="1.0"><animate attributeName="opacity" values=".8;.2;.8" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="766" cy="56"  r="0.9"><animate attributeName="opacity" values=".25;.75;.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="22"  cy="128" r="1.0"><animate attributeName="opacity" values=".7;.2;.7" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="188" cy="152" r="0.7"><animate attributeName="opacity" values=".5;.1;.5" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="146" r="0.7"><animate attributeName="opacity" values=".15;.6;.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="118" r="0.6"><animate attributeName="opacity" values=".45;.1;.45" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="196" r="0.6"><animate attributeName="opacity" values=".1;.5;.1" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- gravitational halo -->
  <ellipse cx="400" cy="150" rx="300" ry="150" fill="url(#halo)">
    <animate attributeName="rx" values="300;318;300" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".85;1;.85" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- relativistic jets -->
  <g filter="url(#soft)" opacity=".5">
    <rect x="396" y="6"   width="8" height="120" fill="url(#jet)">
      <animate attributeName="opacity" values=".35;.9;.35" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="396" y="174" width="8" height="120" fill="url(#jet)">
      <animate attributeName="opacity" values=".9;.35;.9" dur="4.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- lensed far side of the disk, bent up over the horizon -->
  <g filter="url(#glow)">
    <path d="M 252 152 A 148 128 0 0 1 548 152" fill="none" stroke="url(#disk)" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="54 20" opacity=".85">
      <animate attributeName="stroke-dashoffset" values="0;-296" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 286 150 A 114 96 0 0 1 514 150" fill="none" stroke="url(#disk)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="30 26" opacity=".6">
      <animate attributeName="stroke-dashoffset" values="0;-224" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- the hole itself -->
  <circle cx="400" cy="150" r="42" fill="#05060A"/>

  <!-- photon ring -->
  <circle cx="400" cy="150" r="45" fill="none" stroke="#D9C2FF" stroke-width="2.4" filter="url(#glow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="45;47;45" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- accretion disk, near side: inner rings orbit faster -->
  <g filter="url(#glow)">
    <ellipse cx="400" cy="150" rx="78"  ry="17" fill="none" stroke="url(#disk)" stroke-width="3.4"
             stroke-linecap="round" stroke-dasharray="26 11">
      <animate attributeName="stroke-dashoffset" values="0;-370" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="150" rx="106" ry="24" fill="none" stroke="url(#disk)" stroke-width="3"
             stroke-linecap="round" stroke-dasharray="34 15" opacity=".92">
      <animate attributeName="stroke-dashoffset" values="0;-490" dur="2.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="150" rx="138" ry="32" fill="none" stroke="url(#disk)" stroke-width="2.6"
             stroke-linecap="round" stroke-dasharray="42 20" opacity=".78">
      <animate attributeName="stroke-dashoffset" values="0;-620" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="150" rx="172" ry="41" fill="none" stroke="url(#disk)" stroke-width="2.2"
             stroke-linecap="round" stroke-dasharray="50 28" opacity=".6">
      <animate attributeName="stroke-dashoffset" values="0;-780" dur="4.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="150" rx="208" ry="50" fill="none" stroke="url(#disk)" stroke-width="1.8"
             stroke-linecap="round" stroke-dasharray="36 40" opacity=".4">
      <animate attributeName="stroke-dashoffset" values="0;-940" dur="6.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- matter spiralling past the event horizon -->
  <g fill="#FFFFFF">
    <circle r="2.1">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M 760 104 C 652 58 512 78 446 136"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.82;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.7">
      <animateMotion dur="4.2s" begin="-1.1s" repeatCount="indefinite" path="M 40 212 C 150 262 300 240 356 170"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.82;1" dur="4.2s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4">
      <animateMotion dur="3.8s" begin="-2.3s" repeatCount="indefinite" path="M 744 228 C 622 268 470 232 440 172"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.82;1" dur="3.8s" begin="-2.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.6">
      <animateMotion dur="4.6s" begin="-0.6s" repeatCount="indefinite" path="M 56 62 C 168 26 318 56 358 128"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.82;1" dur="4.6s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.9">
      <animateMotion dur="3.1s" begin="-1.8s" repeatCount="indefinite" path="M 400 290 C 470 266 476 212 424 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.82;1" dur="3.1s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
